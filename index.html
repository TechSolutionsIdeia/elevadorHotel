<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do elevador · Hotel Campo Palace</title>
<style>
/* ============================================================
   TOKENS — ouro Campo Palace sobre painéis de papel creme
   ============================================================ */
:root{
  --ouro:#A77208;          /* fundo da cabine */
  --ouro-fundo-2:#8E5F06;  /* base do degradê */
  --papel:#FAF6EE;         /* painéis */
  --passepartout:#F1E8D6;  /* moldura atrás do cartaz */
  --tinta:#2E2413;         /* texto principal sobre creme */
  --tinta-fraca:#7C6740;   /* apoio, legendas */
  --latao:#A77208;         /* acento sobre creme */
  --latao-claro:#C79E4D;   /* acento sobre ouro */
  --linha:rgba(167,114,8,.22);
  --branco:rgba(255,255,255,.92);
  --alta:#2F7D51;
  --baixa:#B8452A;

  --serif:Impact, "Haettenschweiler", "Arial Narrow Bold", sans-serif;
  --sans:"Myriad Variable Concept", "myriad-variable-concept", "Myriad Pro", Myriad, "Segoe UI", system-ui, sans-serif;

  --u: 1vmin;
  --gap: calc(var(--u) * 2.2);
  --raio: calc(var(--u) * 1.4);
  --troca: .8s;            /* duração da passagem entre telas */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--ouro);
  color:var(--tinta);
  font-family:var(--sans);
  font-variant-numeric:tabular-nums;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 75% at 50% -18%, rgba(255,236,190,.30), transparent 60%),
    linear-gradient(180deg, var(--ouro) 0%, var(--ouro-fundo-2) 100%);
}

.cabine{
  position:relative;z-index:1;height:100vh;height:100dvh;
  display:grid;grid-template-rows:auto auto 1fr auto;
  gap:calc(var(--u) * 1.6);
  padding:calc(var(--u) * 3);
}

/* ---------- Cabeçalho ---------- */
.topo{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--gap);
  padding-bottom:calc(var(--u) * .4);
}
.marca{display:flex;align-items:baseline;gap:calc(var(--u) * 1.6);min-width:0}
.marca .selo{
  width:calc(var(--u) * 1.1);height:calc(var(--u) * 3.4);
  background:var(--branco);border-radius:2px;flex:none;align-self:center;
}
.marca h1{
  font-family:var(--serif);font-weight:400;
  font-size:calc(var(--u) * 4.2);letter-spacing:.005em;line-height:1;
  color:var(--branco);white-space:nowrap;
}
.marca .lugar{
  font-size:calc(var(--u) * 1.5);font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);
  white-space:nowrap;
}
.data{
  font-size:calc(var(--u) * 2);font-weight:500;
  color:var(--branco);letter-spacing:.04em;text-align:right;white-space:nowrap;
  transition:opacity .4s;
}
.data b{font-weight:700;margin-left:calc(var(--u) * 1.2)}
/* na tela do relógio a data/hora do topo seria repetida */
body[data-tipo="relogio"] .data{opacity:0}

/* ---------- Régua de progresso (um segmento por tela) ---------- */
.regua{display:flex;gap:calc(var(--u) * .6);height:calc(var(--u) * .55)}
.regua i{flex:1;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;position:relative}
.regua i.feito{background:rgba(255,255,255,.85)}
.regua i.on b{
  position:absolute;inset:0;background:var(--branco);transform-origin:left;
  animation:encher var(--dur, 10s) linear both;
}
@keyframes encher{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- Palco: uma tela por vez ---------- */
/* --lado: 1 quando avança (entra pela direita), -1 quando volta (entra pela esquerda) */
.palco{position:relative;min-height:0;--lado:1;touch-action:none;cursor:grab}
.palco:active{cursor:grabbing}
.slide{
  position:absolute;inset:0;
  background:var(--papel);
  border-radius:var(--raio);
  box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(60,38,0,.20);
  padding:calc(var(--u) * 4) calc(var(--u) * 5);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateX(calc(7% * var(--lado)));
  transition:opacity var(--troca) ease, transform var(--troca) cubic-bezier(.22,.7,.3,1);
  pointer-events:none;
}
.slide.ativo{opacity:1;transform:none}
.slide.saiu{opacity:0;transform:translateX(calc(-7% * var(--lado)))}
.slide img{-webkit-user-drag:none}

.rotulo{
  font-size:calc(var(--u) * 2);font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--latao);
}
.miolo{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

/* ---------- Tela: relógio ---------- */
.s-relogio .miolo{align-items:center;text-align:center}
.hora{display:flex;align-items:baseline;gap:calc(var(--u) * 2);line-height:.8}
.hora .hm{
  font-size:calc(var(--u) * 30);font-weight:600;
  letter-spacing:-.04em;color:var(--tinta);
}
.hora .seg{font-size:calc(var(--u) * 7);font-weight:600;color:var(--latao);letter-spacing:.02em}
.relogio-data{
  margin-top:calc(var(--u) * 3.5);
  font-size:calc(var(--u) * 4.2);font-weight:600;color:var(--tinta);
}
.saudacao{
  margin-top:calc(var(--u) * 1.2);
  font-family:var(--sans);font-style:italic;
  font-size:calc(var(--u) * 4.4);color:var(--tinta-fraca);
}

/* ---------- Tela: moeda ---------- */
.moeda-nome{
  font-family:var(--serif);font-weight:400;
  font-size:calc(var(--u) * 7);line-height:1.05;color:var(--tinta);
  margin-top:calc(var(--u) * 1.4);
}
.moeda-par{
  font-size:calc(var(--u) * 2.2);font-weight:600;letter-spacing:.2em;
  color:var(--tinta-fraca);margin-top:calc(var(--u) * .8);
}
.moeda-valor{
  display:flex;align-items:baseline;gap:calc(var(--u) * 2);flex-wrap:wrap;
  line-height:.9;
}
.moeda-valor small{font-size:calc(var(--u) * 7);font-weight:600;color:var(--tinta-fraca)}
.moeda-valor .num{font-size:calc(var(--u) * 24);font-weight:700;letter-spacing:-.04em;color:var(--tinta)}
.moeda-var{
  display:inline-block;margin-top:calc(var(--u) * 2.4);
  font-size:calc(var(--u) * 4);font-weight:700;
}
.sobe{color:var(--alta)}
.desce{color:var(--baixa)}
.faixa{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:calc(var(--u) * 2) calc(var(--u) * 3);
  padding-top:calc(var(--u) * 2.4);
  border-top:1px solid var(--linha);
}
.faixa.quatro{grid-template-columns:repeat(4,1fr)}
.item{display:flex;flex-direction:column;gap:calc(var(--u) * .5)}
.item b{font-size:calc(var(--u) * 4.4);font-weight:700;color:var(--tinta);line-height:1}
.item span{
  font-size:calc(var(--u) * 1.6);letter-spacing:.16em;
  text-transform:uppercase;color:var(--tinta-fraca);
}

/* ---------- Tela: clima ---------- */
.clima-agora{display:flex;align-items:center;gap:calc(var(--u) * 5);flex-wrap:wrap}
.clima-agora svg{width:calc(var(--u) * 26);height:calc(var(--u) * 26);flex:none;display:block}
.temp{font-size:calc(var(--u) * 26);font-weight:600;letter-spacing:-.04em;line-height:.85;color:var(--tinta)}
.temp sup{font-size:.4em;font-weight:500;vertical-align:super;margin-left:.04em}
.clima-txt{display:flex;flex-direction:column;gap:calc(var(--u) * 1.2);min-width:0}
.clima-desc{font-family:var(--serif);font-weight:400;font-size:calc(var(--u) * 6.4);line-height:1.05}
.clima-max{font-size:calc(var(--u) * 3.2);color:var(--tinta-fraca);font-weight:500}

/* ---------- Tela: evento ---------- */
.s-evento{padding:calc(var(--u) * 3)}
.evento{
  flex:1;min-height:0;
  display:grid;grid-template-columns:1.15fr 1fr;gap:calc(var(--u) * 4);
}
.cartaz{
  min-height:0;background:var(--passepartout);
  border-radius:calc(var(--raio) * .7);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.cartaz img{width:100%;height:100%;object-fit:contain;display:block}
.s-evento.sem-cartaz .evento{grid-template-columns:1fr}
.s-evento.sem-cartaz .cartaz{display:none}

.evt-texto{
  display:flex;flex-direction:column;justify-content:center;
  gap:calc(var(--u) * 2);min-width:0;padding-right:calc(var(--u) * 2);
}
.evt-texto .contagem{
  font-size:calc(var(--u) * 1.7);font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tinta-fraca);
}
.evt-texto .quando{
  font-size:calc(var(--u) * 3.2);font-weight:700;
  color:var(--latao);letter-spacing:.06em;text-transform:uppercase;line-height:1.2;
}
.evt-texto h2{
  font-family:var(--serif);font-weight:400;
  font-size:calc(var(--u) * 8);line-height:1.02;color:var(--tinta);
  overflow-wrap:anywhere;
}
.evt-texto .onde{font-size:calc(var(--u) * 3.2);color:var(--tinta-fraca);line-height:1.3}

/* entrada escalonada do conteúdo quando a tela chega */
.slide .entra{opacity:0;transform:translateY(calc(var(--u) * 2))}
.slide.ativo .entra{animation:sobe .7s cubic-bezier(.22,.7,.3,1) both}
.slide.ativo .entra:nth-child(2){animation-delay:.12s}
.slide.ativo .entra:nth-child(3){animation-delay:.24s}
.slide.ativo .entra:nth-child(4){animation-delay:.36s}
@keyframes sobe{to{opacity:1;transform:none}}

/* ---------- Rodapé ---------- */
.rodape{
  display:flex;align-items:center;justify-content:space-between;gap:var(--gap);
  border-top:1px solid rgba(255,255,255,.28);
  padding-top:calc(var(--u) * 1.6);
}
.recado{
  font-family:var(--sans);font-style:italic;
  font-size:calc(var(--u) * 2.2);color:var(--branco);
}
.estado{
  display:flex;align-items:center;gap:calc(var(--u) * 1);
  letter-spacing:.12em;text-transform:uppercase;
  font-size:calc(var(--u) * 1.3);color:rgba(255,255,255,.72);white-space:nowrap;
}
.dica{
  font-size:calc(var(--u) * 1.3);letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.72);white-space:nowrap;margin-left:auto;
}
.ponto{width:calc(var(--u) * .9);height:calc(var(--u) * .9);border-radius:50%;background:#8CE0AE}
.ponto.demo{background:var(--latao-claro)}
.ponto.off{background:#F0A48C}

/* ---------- Retrato ---------- */
@media (max-aspect-ratio: 1/1){
  :root{--u:1.15vmin}
  .slide{padding:calc(var(--u) * 4)}
  .marca .lugar{display:none}
  .hora .hm{font-size:calc(var(--u) * 21)}
  .hora .seg{font-size:calc(var(--u) * 5)}
  .moeda-valor .num{font-size:calc(var(--u) * 17)}
  .moeda-valor small{font-size:calc(var(--u) * 5)}
  .clima-agora{gap:calc(var(--u) * 3)}
  .clima-agora svg,.temp{width:auto}
  .clima-agora svg{width:calc(var(--u) * 16);height:calc(var(--u) * 16)}
  .temp{font-size:calc(var(--u) * 17)}
  .faixa.quatro{grid-template-columns:1fr 1fr}
  .evento{grid-template-columns:1fr;grid-template-rows:1.3fr auto;gap:calc(var(--u) * 2.4)}
  .s-evento.sem-cartaz .evento{grid-template-rows:1fr}
  .evt-texto{padding:0 calc(var(--u) * 1) calc(var(--u) * 1)}
  .evt-texto h2{font-size:calc(var(--u) * 6)}
}
@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .3s;transform:none !important}
  .slide.ativo .entra{animation:none;opacity:1;transform:none}
  .regua i.on b{animation:none;transform:none}
}
</style>
</head>
<body>

<div class="cabine">

  <header class="topo">
    <div class="marca">
      <div class="selo"></div>
      <h1 id="hotelNome">Hotel Campo Palace</h1>
      <div class="lugar" id="hotelLugar">Campo Mourão · PR</div>
    </div>
    <div class="data"><span id="dataHoje">—</span><b id="horaTopo">--:--</b></div>
  </header>

  <div class="regua" id="regua"></div>

  <main class="palco" id="palco">

    <!-- Tela 1: horário -->
    <section class="slide s-relogio" data-tipo="relogio" id="slideRelogio">
      <div class="miolo">
        <div class="hora entra">
          <span class="hm" id="horaMin">--:--</span>
          <span class="seg" id="segundos">--</span>
        </div>
        <div class="relogio-data entra" id="relogioData">—</div>
        <div class="saudacao entra" id="saudacao">Seja bem-vindo</div>
      </div>
    </section>

    <!-- Telas de câmbio são criadas pelo script, uma por moeda -->

    <!-- Tela: clima -->
    <section class="slide s-clima" data-tipo="clima" id="slideClima">
      <div class="rotulo" id="rotuloClima">Agora em Campo Mourão</div>
      <div class="miolo">
        <div class="clima-agora entra">
          <div id="climaIcone"></div>
          <div class="temp" id="climaTemp">--<sup>°</sup></div>
          <div class="clima-txt">
            <div class="clima-desc" id="climaDesc">Carregando</div>
            <div class="clima-max" id="climaMax">—</div>
          </div>
        </div>
      </div>
      <div class="faixa quatro">
        <div class="item"><b id="climaSensacao">--°</b><span>Sensação</span></div>
        <div class="item"><b id="climaUmidade">--%</b><span>Umidade</span></div>
        <div class="item"><b id="climaVento">-- km/h</b><span>Vento</span></div>
        <div class="item"><b id="climaChuva">--%</b><span>Chuva hoje</span></div>
      </div>
    </section>

    <!-- Telas de evento são criadas pelo script, uma por evento -->

  </main>

  <footer class="rodape">
    <div class="recado" id="recado">Café da manhã das 6h30 às 10h, no térreo.</div>
  </footer>

</div>

<template id="modeloMoeda">
  <section class="slide s-moeda dinamico" data-tipo="moeda">
    <div class="rotulo">Cotação do dia</div>
    <div class="miolo">
      <div class="entra">
        <div class="moeda-nome" data-campo="nome">—</div>
        <div class="moeda-par" data-campo="par">—</div>
      </div>
      <div class="entra" style="margin-top:calc(var(--u) * 4)">
        <div class="moeda-valor"><small>R$</small><span class="num" data-campo="valor">--</span></div>
        <div class="moeda-var" data-campo="var">—</div>
      </div>
    </div>
    <div class="faixa">
      <div class="item"><b data-campo="max">--</b><span>Máxima do dia</span></div>
      <div class="item"><b data-campo="min">--</b><span>Mínima do dia</span></div>
      <div class="item"><b data-campo="hora">--:--</b><span>Atualizado</span></div>
    </div>
  </section>
</template>

<template id="modeloEvento">
  <section class="slide s-evento dinamico" data-tipo="evento">
    <div class="evento">
      <div class="cartaz"><img alt="" draggable="false"></div>
      <div class="evt-texto">
        <div class="rotulo entra">Acontece na cidade</div>
        <div class="entra" style="display:flex;flex-direction:column;gap:calc(var(--u) * 1.4)">
          <div class="quando" data-campo="quando">—</div>
          <h2 data-campo="titulo">—</h2>
        </div>
        <div class="onde entra" data-campo="onde"></div>
        <div class="contagem entra" data-campo="contagem"></div>
      </div>
    </div>
  </section>
</template>

<script
  data-cfasync="false"
  data-no-optimize="1"
  data-no-defer="1"
  data-noptimize="1"
  data-nowprocket
  data-wpfc-render="false"
  data-pagespeed-no-defer
  nitro-exclude>
/* ================================================================
   1. CONFIGURAÇÃO — é só aqui que o hotel mexe
   ================================================================ */
const CONFIG = {
  hotel: "Hotel Campo Palace",
  cidade: "Campo Mourão",
  uf: "PR",
  lat: -24.0463,
  lon: -52.3783,
  fuso: "America/Sao_Paulo",

  // Cada moeda vira uma tela própria, nesta ordem
  moedas: ["USD-BRL", "EUR-BRL", "ARS-BRL"],
  nomesMoedas: { USD:"Dólar americano", EUR:"Euro", ARS:"Peso argentino", GBP:"Libra esterlina" },

  // Cartaz usado quando o evento não tiver imagem própria
  imagemPadrao: "",

  recados: [
    "Café da manhã das 6h30 às 10h, no térreo.",
    "Wi-Fi: rede CAMPOPALACE-HOSPEDES · senha na chave do quarto.",
    "Recepção 24 horas — ramal 9.",
    "Check-out até as 12h. Precisa de mais tempo? Fale conosco."
  ],

  agendaURL: null,      // ex.: "https://hotelcampopalace.com.br/agenda.json"
  maxEventos: 6,

  // Segundos que cada tipo de tela fica no ar
  duracao: { relogio: 8, moeda: 7, clima: 9, evento: 12 },

  // Depois que o hóspede desliza ou toca, a tela escolhida fica no ar por este tempo
  pausaAposToque: 25,

  atualizarClima: 10 * 60 * 1000,
  atualizarCambio: 5 * 60 * 1000,
  atualizarAgenda: 60 * 60 * 1000
};

/* Agenda de reserva — cada item aceita "imagem"; sem ela, entra a padrão */
const AGENDA_RESERVA = [
    { titulo:"Cinemaxs",
      quando:"Confira horários e ingressos",
      inicio:"2026-08-01", fim:"2026-12-31",
      local:"Shopping Família — Campo Mourão · PR",
      imagem:"https://hotelcampopalace.com.br/wp-content/uploads/2026/09/Prancheta-2-copiar.jpg.jpeg" },

    { titulo:"Caminho de Santiago",
      quando:"Consulte as datas e rotas",
      inicio:"2026-08-01", fim:"2026-12-31",
      local:"Campo Mourão, Corumbataí do Sul, Barbosa Ferraz e Fênix",
      imagem:"https://hotelcampopalace.com.br/wp-content/uploads/2026/08/Prancheta-1-copiar-3.jpg.jpeg" },

    { titulo:"Campo Mourão no Prato",
      inicio:"2026-08-17", fim:"2026-08-31",
      local:"93 estabelecimentos da cidade com pratos especiais",
      imagem:"https://hotelcampopalace.com.br/wp-content/uploads/2026/08/Prancheta-1.jpg.jpeg" },

    { titulo:"Festa Ucraniana",
      inicio:"2026-09-12", fim:"2026-09-13",
      local:"Paróquia Imaculado Coração de Maria — Irati · PR",
      imagem:"https://hotelcampopalace.com.br/wp-content/uploads/2026/08/Prancheta-1-copiar-2.jpg.jpeg" },

    { titulo:"14º Festival de Rock",
      quando:"19 de setembro",
      inicio:"2026-09-19", fim:"2026-09-19",
      local:"Mourão Garden — Campo Mourão · PR",
      imagem:"https://hotelcampopalace.com.br/wp-content/uploads/2026/09/Prancheta-2.png" },

    { titulo:"Feira de Profissões",
      inicio:"2026-09-25T08:00:00-03:00", fim:"2026-09-25T22:00:00-03:00",
      local:"Integrado — Campo Mourão · PR",
      imagem:"https://hotelcampopalace.com.br/wp-content/uploads/2026/09/Prancheta-2-copiar-2.jpg.jpeg" },
];

/* ================================================================
   2. ESTADO
   ================================================================ */
const estado = {
  agenda: [], demo: false, falhas: 0,
  slides: [], atual: -1, elAtual: null, timer: null,
  agendaNova: false
};
const $ = id => document.getElementById(id);

/* ================================================================
   3. RELÓGIO E DATA
   ================================================================ */
const fmt = (opts) => new Intl.DateTimeFormat("pt-BR", { timeZone: CONFIG.fuso, ...opts });
const maiuscula = s => s.charAt(0).toUpperCase() + s.slice(1);

function tique(){
  const agora = new Date();
  const p = Object.fromEntries(
    fmt({ hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false })
      .formatToParts(agora).map(x => [x.type, x.value])
  );
  $("horaMin").textContent = `${p.hour}:${p.minute}`;
  $("segundos").textContent = p.second;
  $("horaTopo").textContent = `${p.hour}:${p.minute}`;

  const data = maiuscula(fmt({ weekday:"long", day:"numeric", month:"long" }).format(agora));
  $("dataHoje").textContent = data;
  $("relogioData").textContent = data;

  const h = +p.hour;
  $("saudacao").textContent =
    h < 5  ? "Boa madrugada" :
    h < 12 ? "Bom dia" :
    h < 18 ? "Boa tarde" : "Boa noite";
}

/* ================================================================
   4. CLIMA — Open-Meteo (sem chave)
   ================================================================ */
const TEMPO = {
  0:["Céu limpo","sol"], 1:["Predomínio de sol","sol"], 2:["Parcialmente nublado","solnuvem"],
  3:["Nublado","nuvem"], 45:["Nevoeiro","neblina"], 48:["Nevoeiro gelado","neblina"],
  51:["Garoa fraca","chuva"], 53:["Garoa","chuva"], 55:["Garoa forte","chuva"],
  61:["Chuva fraca","chuva"], 63:["Chuva","chuva"], 65:["Chuva forte","chuva"],

  raio:`<path d="M18 38a12 12 0 0 1 1.4-23.9A16 16 0 0 1 50 18a11 11 0 0 1-1 20z" fill="${C}"/><path d="M34 40l-11 15h8l-3 11 13-16h-8l4-10z" fill="${T}"/>`,

};
const svg = nome => `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONES[nome] || ICONES.nuvem}</svg>`;

async function buscarClima(){
  const url = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`
    + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code"
    + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + `&timezone=${encodeURIComponent(CONFIG.fuso)}&forecast_days=1`;

  const r = await fetch(url);
  if(!r.ok) throw new Error("clima " + r.status);
  const d = await r.json();
  const a = d.current, hoje = d.daily;
  const [desc, icone] = TEMPO[a.weather_code] || ["—","nuvem"];

  $("climaIcone").innerHTML  = svg(icone);
  $("climaTemp").innerHTML   = Math.round(a.temperature_2m) + "<sup>°</sup>";
  $("climaDesc").textContent = desc;
  $("climaMax").textContent  = `Máx ${Math.round(hoje.temperature_2m_max[0])}° · Mín ${Math.round(hoje.temperature_2m_min[0])}°`;
  $("climaSensacao").textContent = Math.round(a.apparent_temperature) + "°";
  $("climaUmidade").textContent  = Math.round(a.relative_humidity_2m) + "%";
  $("climaVento").textContent    = Math.round(a.wind_speed_10m) + " km/h";
  $("climaChuva").textContent    = (hoje.precipitation_probability_max[0] ?? 0) + "%";
}

  $("climaMax").textContent  = "Máx 27° · Mín 15°";
  $("climaSensacao").textContent = "24°";
  $("climaUmidade").textContent  = "61%";
  $("climaVento").textContent    = "11 km/h";
  $("climaChuva").textContent    = "20%";
}

/* ================================================================
   5. CÂMBIO — AwesomeAPI (sem chave), uma tela por moeda
   ================================================================ */
/* moedas baratas (ex.: peso argentino) precisam de mais casas para não virar "0,00" */
const dinheiro = v => {
  const n = Number(v), casas = n < 1 ? 4 : 2;
  return n.toLocaleString("pt-BR",{ minimumFractionDigits:casas, maximumFractionDigits:casas });
};
const sigla = par => par.split("-")[0];

function criarSlidesMoedas(){
  const palco = $("palco"), clima = $("slideClima");
  return CONFIG.moedas.map(par => {
    const el = $("modeloMoeda").content.firstElementChild.cloneNode(true);
    const s = sigla(par);
    el.id = "moeda-" + s;
    el.querySelector('[data-campo="nome"]').textContent = CONFIG.nomesMoedas[s] || s;
    el.querySelector('[data-campo="par"]').textContent  = `1 ${s} em reais`;
    palco.insertBefore(el, clima);
    return el;
  });
}

function pintarMoedas(linhas){
  linhas.forEach(m => {
    const el = $("moeda-" + m.sigla);
    if(!el) return;
    const campo = n => el.querySelector(`[data-campo="${n}"]`);
    campo("valor").textContent = dinheiro(m.valor);
    const v = campo("var");
    v.className = "moeda-var " + (m.pct >= 0 ? "sobe" : "desce");
    v.textContent = `${m.pct >= 0 ? "▲" : "▼"} ${Math.abs(m.pct).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}% hoje`;
    campo("max").textContent  = "R$ " + dinheiro(m.max);
    campo("min").textContent  = "R$ " + dinheiro(m.min);
    campo("hora").textContent = m.hora;
  });
}

async function buscarCambio(){
  const r = await fetch("https://economia.awesomeapi.com.br/json/last/" + CONFIG.moedas.join(","));
  if(!r.ok) throw new Error("câmbio " + r.status);
  const d = await r.json();

  pintarMoedas(CONFIG.moedas.map(par => {
    const m = d[par.replace("-","")];
    return {
      sigla: m.code, valor: m.bid, pct: parseFloat(m.pctChange),
      max: m.high, min: m.low,
      hora: (m.create_date || "").slice(11, 16) || "--:--"
    };
  }));
}

function cambioDemo(){
  pintarMoedas([
    { sigla:"USD", valor:5.42,   pct: 0.38, max:5.45,   min:5.39,   hora:"10:30" },
    { sigla:"EUR", valor:5.89,   pct:-0.21, max:5.93,   min:5.87,   hora:"10:30" },
    { sigla:"ARS", valor:0.0041, pct: 0.07, max:0.0042, min:0.0040, hora:"10:30" }
  ]);
}

/* ================================================================
   6. AGENDA DA CIDADE
   ================================================================ */
async function buscarAgenda(){
  let lista = AGENDA_RESERVA;
  if(CONFIG.agendaURL){
    try{
      const r = await fetch(CONFIG.agendaURL, { cache:"no-store" });
      if(r.ok) lista = await r.json();
    }catch(e){ /* cai na reserva */ }
  }
  estado.agenda = prepararAgenda(lista);
  estado.agendaNova = true;   // as telas de evento são refeitas na próxima troca
  precarregar();
}

function prepararAgenda(lista){
  const agora = Date.now();
  return lista
    .filter(e => new Date(e.fim || e.inicio).getTime() >= agora - 6*3600*1000)
    .sort((a,b) => new Date(a.inicio) - new Date(b.inicio))
    .slice(0, CONFIG.maxEventos)
    .map(e => ({ ...e, imagem: e.imagem || CONFIG.imagemPadrao }));
}

/* carrega os cartazes fora da tela para a troca não piscar */
function precarregar(){
  estado.agenda.forEach(e => { if(e.imagem){ const i = new Image(); i.src = e.imagem; } });
}

/* Para eventos de um dia só, mostra "Hoje · 21:00" / "Amanhã · 21:00" / "Segunda-feira, 17 de agosto · 21:00".
   Para eventos de vários dias (fim diferente do início), mostra o período completo,
   igual ao cartaz: "17 a 31 de agosto" (sem hora, já que não é um horário único). */
function quandoTexto(e){
  const ini  = new Date(e.inicio);
  const fim  = e.fim ? new Date(e.fim) : null;

  if(fim && fim.toDateString() !== ini.toDateString()){
    const diaIni = fmt({ day:"numeric" }).format(ini);
    const diaFim = fmt({ day:"numeric" }).format(fim);
    const mesIni = fmt({ month:"long" }).format(ini);
    const mesFim = fmt({ month:"long" }).format(fim);

    return mesIni === mesFim
      ? `${diaIni} a ${diaFim} de ${mesFim}`
      : `${diaIni} de ${mesIni} a ${diaFim} de ${mesFim}`;
  }

  const hoje = fmt({ dateStyle:"short" }).format(new Date());
  const dia  = fmt({ dateStyle:"short" }).format(ini);
  const hora = fmt({ hour:"2-digit", minute:"2-digit", hour12:false }).format(ini);

  const amanha = new Date(); amanha.setDate(amanha.getDate() + 1);
  const ehAmanha = fmt({ dateStyle:"short" }).format(amanha) === dia;

  if(dia === hoje) return `Hoje · ${hora}`;
  if(ehAmanha)     return `Amanhã · ${hora}`;
  return maiuscula(fmt({ weekday:"long", day:"numeric", month:"long" }).format(ini)) + ` · ${hora}`;
}

function criarSlidesEventos(){
  const palco = $("palco"), total = estado.agenda.length;
  return estado.agenda.map((e, i) => {
    const el = $("modeloEvento").content.firstElementChild.cloneNode(true);
    const campo = n => el.querySelector(`[data-campo="${n}"]`);
    const img = el.querySelector("img");

    if(e.imagem){
      img.onerror = () => el.classList.add("sem-cartaz");   // sem cartaz, o texto ocupa a tela
      img.src = e.imagem;
      img.alt = e.titulo;
    } else {
      el.classList.add("sem-cartaz");
    }

    campo("quando").textContent   = e.quando || quandoTexto(e);
    campo("titulo").textContent   = e.titulo;
    campo("onde").textContent     = e.local || "";
    campo("contagem").textContent = total > 1 ? `Evento ${i + 1} de ${total}` : "";

    palco.appendChild(el);
    return el;
  });
}

/* ================================================================
   7. CARROSSEL — horário → câmbio → clima → eventos → (repete)
   ================================================================ */
let slidesMoedas = [], slidesEventos = [];

function montarSequencia(){
  if(estado.agendaNova){
    const velhos = slidesEventos;
    slidesEventos = criarSlidesEventos();
    estado.agendaNova = false;
    // os antigos saem de cena depois que a transição termina
    setTimeout(() => velhos.forEach(n => n.remove()), 1200);
  }
  estado.slides = [$("slideRelogio"), ...slidesMoedas, $("slideClima"), ...slidesEventos];
}

function pintarRegua(dur){
  $("regua").innerHTML = estado.slides.map((_, i) =>
    i < estado.atual  ? '<i class="feito"></i>' :
    i === estado.atual ? `<i class="on" style="--dur:${dur}s"><b></b></i>` :
                         "<i></i>"
  ).join("");
}

/* Vai para a tela "indice". dir = 1 avança, -1 volta.
   "segundos" substitui a duração normal (usado depois de um toque). */
function irPara(indice, dir = 1, segundos){
  clearTimeout(estado.timer);

  // só refaz a sequência ao virar a volta, para a régua não pular no meio
  const virou = estado.atual < 0 || indice >= estado.slides.length || indice < 0;
  if(estado.agendaNova && virou) montarSequencia();

  const total = estado.slides.length;
  estado.atual = ((indice % total) + total) % total;

  const el = estado.slides[estado.atual];
  const anterior = estado.elAtual;
  $("palco").style.setProperty("--lado", dir);

  estado.slides.forEach(s => { if(s !== anterior && s !== el) s.classList.remove("saiu", "ativo"); });

  if(anterior && anterior !== el){
    anterior.style.transition = "";
    anterior.style.transform = "";     // sai a partir de onde o dedo largou
    anterior.classList.remove("ativo");
    anterior.classList.add("saiu");
  }

  // posiciona a tela nova do lado certo antes de animar a entrada
  el.style.transition = "none";
  el.style.transform = "";
  el.classList.remove("saiu", "ativo");
  void el.offsetWidth;
  el.style.transition = "";
  el.classList.add("ativo");
  estado.elAtual = el;

  const tipo = el.dataset.tipo;
  document.body.dataset.tipo = tipo;
  const dur = segundos || CONFIG.duracao[tipo] || 10;
  pintarRegua(dur);

  $("recado").textContent = CONFIG.recados[estado.atual % CONFIG.recados.length];

  estado.timer = setTimeout(() => irPara(estado.atual + 1, 1), dur * 1000);
}

/* ================================================================
   7b. TOQUE — deslizar para os lados, tocar nas bordas, setas do teclado
   ================================================================ */
function ativarToque(){
  const palco = $("palco");
  let gesto = null;

  palco.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(!estado.elAtual) return;
    clearTimeout(estado.timer);      // não troca sozinho com o dedo na tela
    gesto = { id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), dx:0 };
    try{ palco.setPointerCapture(e.pointerId); }catch(_){ /* segue sem captura */ }
    estado.elAtual.style.transition = "none";
  });

  palco.addEventListener("pointermove", e => {
    if(!gesto || e.pointerId !== gesto.id) return;
    gesto.dx = e.clientX - gesto.x;
    estado.elAtual.style.transform = `translateX(${gesto.dx}px)`;
  });

  const soltar = e => {
    if(!gesto || e.pointerId !== gesto.id) return;
    const { dx, t } = gesto;
    gesto = null;

    const el = estado.elAtual;
    const largura = palco.clientWidth;
    const tempo = performance.now() - t;
    const rapido = Math.abs(dx) > 30 && Math.abs(dx) / tempo > .5;
    const pausa = CONFIG.pausaAposToque;

    if(Math.abs(dx) > largura * .15 || rapido){
      dx < 0 ? irPara(estado.atual + 1, 1, pausa) : irPara(estado.atual - 1, -1, pausa);
      return;
    }

    // toque rápido sem arrastar: bordas trocam de tela
    if(e.type === "pointerup" && Math.abs(dx) < 10 && tempo < 400){
      const x = e.clientX - palco.getBoundingClientRect().left;
      if(x > largura * .75){ irPara(estado.atual + 1,  1, pausa); return; }
      if(x < largura * .25){ irPara(estado.atual - 1, -1, pausa); return; }
    }

    // não chegou a trocar: volta para o lugar e segura a tela um pouco mais
    el.style.transition = "";
    el.style.transform = "";
    pintarRegua(pausa);
    estado.timer = setTimeout(() => irPara(estado.atual + 1, 1), pausa * 1000);
  };
  palco.addEventListener("pointerup", soltar);
  palco.addEventListener("pointercancel", soltar);

  document.addEventListener("keydown", e => {
    if(e.key === "ArrowRight") irPara(estado.atual + 1,  1, CONFIG.pausaAposToque);
    if(e.key === "ArrowLeft")  irPara(estado.atual - 1, -1, CONFIG.pausaAposToque);
  });
}

/* ================================================================
   8. ESTADO DA CONEXÃO
   ================================================================ */
function marcarEstado(){
  const p = $("ponto"), t = $("estadoTxt");
  if(!p || !t) return;
  p.className = "ponto" + (estado.demo ? " demo" : estado.falhas ? " off" : "");
  t.textContent = estado.demo ? "Modo demonstração" : estado.falhas ? "Reconectando" : "Ao vivo";
}

async function tentar(fn, reserva){
  try{ await fn(); estado.falhas = 0; }
  catch(e){ estado.falhas++; estado.demo = true; reserva(); }
  marcarEstado();
}

/* ================================================================
   9. PARTIDA
   ================================================================ */
async function iniciar(){
  $("hotelNome").textContent   = CONFIG.hotel;
  $("hotelLugar").textContent  = `${CONFIG.cidade} · ${CONFIG.uf}`;
  $("rotuloClima").textContent = `Agora em ${CONFIG.cidade}`;

  tique();
  setInterval(tique, 1000);

  slidesMoedas = criarSlidesMoedas();

  // o relógio já entra no ar enquanto os dados carregam
  estado.slides = [$("slideRelogio"), ...slidesMoedas, $("slideClima")];

  await Promise.all([
    tentar(buscarClima,  climaDemo),
    tentar(buscarCambio, cambioDemo),
    buscarAgenda()
  ]);

  irPara(0);
  ativarToque();

  setInterval(() => tentar(buscarClima,  climaDemo),  CONFIG.atualizarClima);
  setInterval(() => tentar(buscarCambio, cambioDemo), CONFIG.atualizarCambio);
  setInterval(buscarAgenda, CONFIG.atualizarAgenda);

  // Dentro de um iframe, quem cuida da tela acesa e do recarregamento é a
  // página que hospeda o painel. Solto na TV, o painel cuida de si mesmo.
  const soltoNaTela = (window.self === window.top);

  if(soltoNaTela && "wakeLock" in navigator){
    const segurar = () => navigator.wakeLock.request("screen").catch(()=>{});
    segurar();
    document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && segurar());
  }
  if(soltoNaTela) setInterval(() => {
    const h = +fmt({ hour:"2-digit", hour12:false }).format(new Date());
    if(h === 4) location.reload();
  }, 60 * 60 * 1000);
}

iniciar();
</script>
